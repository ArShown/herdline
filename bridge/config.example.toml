# Copy to ~/.config/herdline/config.toml

# Listen on the Tailscale address only (`tailscale ip -4`), never 0.0.0.0.
host = "127.0.0.1"
port = 8787

# Claude Code config directories; transcripts are read from <dir>/projects.
# Default: ~/.claude and every ~/.claude-* that has a projects/ folder.
# config_dirs = ["~/.claude", "~/.claude-work"]

# Where the status line script writes <session_id>.json with used_percentage.
context_dir = "~/.claude/state/ctx"

state_dir = "~/.local/state/herdline"

# Folder every space opened from the phone starts in; leave unset to disable opening spaces.
# space_cwd = "~/projects"

# A new space uses the account with the lowest weekly usage, read from these files
# (JSON with seven_day.used_percentage, e.g. saved by your status line script).
# [usage_files]
# claude = "~/.claude/state/usage/claude.json"

# Arguments for `claude` in a space opened from the phone.
# claude_args = ["--permission-mode", "auto"]

# herdr workspace label = name shown on the phone
[aliases]
# my_api = "API"
